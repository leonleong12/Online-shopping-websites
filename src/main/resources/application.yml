spring:
  profiles:
    active: local
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost\\SQLEXPRESS01};databaseName=online_shop;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:online_shop_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: 8081
  error:
    include-message: always
